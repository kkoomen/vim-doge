name: Tests
on:
  workflow_dispatch:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  test_vim:
    name: Vim
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        vim-version: [v8.2.5172, v9.0.1500]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout kkoomen/vim-doge
        uses: actions/checkout@v7

      - name: Checkout junegunn/vader.vim
        uses: actions/checkout@v7
        with:
          repository: junegunn/vader.vim
          path: vader.vim

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (unix)
        run: ./scripts/build.sh
        shell: bash

      - name: Setup vim
        uses: rhysd/action-setup-vim@v1
        id: vim
        with:
          version: ${{ matrix.vim-version }}
          neovim: false

      - name: Run tests
        run: ./scripts/run-vader-tests.sh "${{ steps.vim.outputs.executable }}"
        shell: bash

  test_old_vim:
    name: Vim
    strategy:
      fail-fast: false
      matrix:
        include:
          # Vim 7.4.2119 and 8.2.1118 are the minimum supported versions, but
          # they cannot be built on macOS anymore: their configure fails with
          # "NOT FOUND! You need to install a terminal library" because modern
          # clang/Xcode rejects the implicit-int main() used by the old
          # configure checks. See rhysd/action-setup-vim#38 and vim 8.2.5135.
          - os: ubuntu-latest
            vim-version: v7.4.2119
          - os: ubuntu-latest
            vim-version: v8.2.1118
          # v8.2.5136 is the oldest Vim version that builds on current macOS
          # runners (the configure fix landed in v8.2.5135).
          - os: macos-latest
            vim-version: v8.2.5136
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout kkoomen/vim-doge
        uses: actions/checkout@v7

      - name: Checkout junegunn/vader.vim
        uses: actions/checkout@v7
        with:
          repository: junegunn/vader.vim
          path: vader.vim

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (unix)
        run: ./scripts/build.sh
        shell: bash

      - name: Setup vim
        uses: rhysd/action-setup-vim@v1
        id: vim
        with:
          version: ${{ matrix.vim-version }}
          neovim: false
          configure-args: |
            --with-features=huge --enable-fail-if-missing --disable-nls

      - name: Run tests
        run: ./scripts/run-vader-tests.sh "${{ steps.vim.outputs.executable }}"
        shell: bash

  test_neovim:
    name: Neovim
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        vim-version: [v0.3.2, stable]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout kkoomen/vim-doge
        uses: actions/checkout@v7

      - name: Checkout junegunn/vader.vim
        uses: actions/checkout@v7
        with:
          repository: junegunn/vader.vim
          path: vader.vim

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (unix)
        run: ./scripts/build.sh
        shell: bash

      - name: Setup neovim
        uses: rhysd/action-setup-vim@v1
        id: vim
        with:
          version: ${{ matrix.vim-version }}
          neovim: true

      - name: Run tests
        run: ./scripts/run-vader-tests.sh "${{ steps.vim.outputs.executable }}"
        shell: bash

  vint:
    name: Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7

      # https://github.com/Vimjas/vint/issues/329#issuecomment-1029628054
      - run: pip install git+https://github.com/Vimjas/vint.git

      - run: vint -s ./autoload ./plugin
